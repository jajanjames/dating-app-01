name: jdate
description: "Naam — Your kind of connection. Meet someone who feels like home."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_screenutil: ^5.9.3
  get: ^4.7.3
  http: ^1.6.0
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.13.1
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  flutter_secure_storage: ^11.2.0
  http_parser: ^4.1.2
  mapbox_search: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
